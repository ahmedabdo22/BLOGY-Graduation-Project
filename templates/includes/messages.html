{% if messages %}
<div style="padding:.75rem 2.5rem 0;">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}" data-dismiss="4000">
    {% if message.tags == 'success' %}✅{% elif message.tags == 'error' %}❌{% else %}ℹ️{% endif %}
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}

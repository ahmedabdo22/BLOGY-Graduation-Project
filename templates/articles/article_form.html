{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group mb-3">
      <label for="id_publication">Publication</label>
      <select name="publication" id="id_publication" class="form-control">
        <option value="">-- None --</option>
        {% for pub in publications %}
          <option value="{{ pub.id }}" {% if form.instance.publication == pub %}selected{% endif %}>
            {{ pub.name }}
          </option>
        {% endfor %}
      </select>
    </div>
    {{ form.as_p }}
    <button class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}

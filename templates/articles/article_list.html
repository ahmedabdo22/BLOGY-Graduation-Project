{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>Articles</h1>
  {% for article in articles %}
    <div class="card p-3 mb-3">
      <h3><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3>
      <p>{{ article.content|truncatewords:30 }}</p>
    </div>
  {% empty %}
    <p>No articles yet.</p>
  {% endfor %}
</div>
{% endblock %}

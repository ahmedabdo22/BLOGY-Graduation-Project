{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>Notifications</h1>
  <a href="{% url 'notifications:mark_all_read' %}" class="btn btn-secondary mb-3">Mark all as read</a>
  {% for notification in notifications %}
    <div class="border p-2 mb-2 {% if not notification.is_read %}fw-bold{% endif %}">
      {{ notification.message }} - {{ notification.created_at }}
    </div>
  {% empty %}
    <p>No notifications.</p>
  {% endfor %}
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
<h1>Publications List</h1>
<div class="toolbar">
</div>

<div class="card">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Author</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
        <tbody>
            {% for item in subscriptions %}
            <tr>
                <td style="color:var(--muted);">{{ item.id }}</td>
                <td><strong>{{ item.author.username }}</strong></td>
                <td>{{ item.created_at }}</td>
                <td>
                    <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
                      <a href="#" class="btn btn-secondary btn-sm">👁</a>
                      <a href="#" class="btn btn-success btn-sm">✏️</a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
  </div>

</div>

</div>

{% endblock %}

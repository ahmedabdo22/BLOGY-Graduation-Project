{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>Category: {{ category.name }}</h1>
  {% for article in articles %}
    <p><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></p>
  {% empty %}
    <p>No articles in this category.</p>
  {% endfor %}
</div>
{% endblock %}

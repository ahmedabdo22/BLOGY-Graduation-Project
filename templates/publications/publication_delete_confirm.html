{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>Delete Publication</h1><br><br>
<div style="max-width:480px;">
  <div class="card">
    <div class="alert alert-error">
      ⚠️ You are about to delete <strong>{{ publication.name }}</strong>.
    </div>
    <p style="color:var(--muted);margin-bottom:1.5rem;font-size:.9rem;">
      All data related to this publication will be removed from the system.
    </p>
    <div style="display:flex;gap:.75rem;">
      <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
      </form>
      <a href="{% url 'publications:publications_view'  %}" class="btn btn-secondary">✕ Cancel</a>
    </div>
  </div>
</div>


</div>
{% endblock %}

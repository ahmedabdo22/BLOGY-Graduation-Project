{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h1>My Profile</h1>
  <p>Username: {{ request.user.username }}</p>
  <p>Email: {{ request.user.email }}</p>
  <p>Bio: {{ request.user.profile.bio }}</p>
  <a href="{% url 'accounts:edit_profile' %}" class="btn btn-primary">Edit Profile</a>


</div>
{% endblock %}

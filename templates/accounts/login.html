{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — MLDash</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-title">Welcome back</div>
    <p class="auth-sub">Sign in to your Blogy</p>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url "accounts:login_view" %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="your_username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem;">
        Sign In →
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="#">Register</a>
    </div>
  </div>
</div>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
